<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>слабости или последствия слабости</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* видео фон */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }
        
        .container {
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* заголовок с афишей */
        .header-poster {
            text-align: center;
            margin-bottom: 30px;
            border: 3px solid #fff;
            padding: 10px;
            background: rgba(0,0,0,0.8);
        }
        .header-poster img {
            width: 100%;
            max-width: 300px;
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
        }
        
        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-align: center;
            margin: 30px 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #cc3333;
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
            line-height: 1.8;
        }
        
        .event-description {
            background: rgba(0,0,0,0.9);
            border: 2px solid #fff;
            padding: 20px;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        .info {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #fff;
        }
        .date { 
            font-size: 24px; 
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-family: 'Press Start 2P', cursive;
        }
        .venue { 
            font-size: 16px; 
            color: #cc3333;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .band { 
            font-size: 20px; 
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        .ticket-btn {
            width: 100%;
            padding: 22px;
            background: #cc3333;
            color: #fff;
            border: 3px solid #fff;
            font-size: 18px;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            cursor: pointer;
            margin: 20px 0;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 4px 4px 0 #fff;
        }
        .ticket-btn:active {
            background: #fff;
            color: #000;
            border-color: #cc3333;
            box-shadow: 2px 2px 0 #cc3333;
            transform: translate(2px, 2px);
        }
        
        .payment {
            display: none;
            background: rgba(0,0,0,0.95);
            border: 3px solid #fff;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
        }
        .payment.active { display: block; }
        
        .payment h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #cc3333;
        }
        
        .payment p {
            margin: 10px 0;
            font-size: 18px;
        }
        
        .phone {
            font-size: 24px;
            margin: 20px 0;
            cursor: pointer;
            text-decoration: underline;
            letter-spacing: 2px;
            font-family: 'Press Start 2P', cursive;
        }
        .phone:active { color: #cc3333; }
        
        .qr-container {
            margin: 25px auto;
            background: #fff;
            padding: 15px;
            display: inline-block;
            cursor: pointer;
            border: 3px solid #fff;
            box-shadow: 4px 4px 0 #cc3333;
        }
        .qr-container:active { transform: scale(0.95); }
        
        .sum { 
            font-size: 24px; 
            margin: 20px 0;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            color: #cc3333;
        }
        
        .pay-btn {
            width: 100%;
            padding: 18px;
            background: #cc3333;
            color: #fff;
            border: 3px solid #fff;
            font-size: 14px;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px 0;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 #fff;
        }
        .pay-btn:active {
            background: #fff;
            color: #000;
            border-color: #cc3333;
            box-shadow: 2px 2px 0 #cc3333;
        }
        
        .back-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'VT323', monospace;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 18px;
        }
        .back-btn:active {
            background: #fff;
            color: #000;
        }
        
        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        
        /* пиксельный эффект */
        .pixel-border {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    
    <div class="container">
        <div class="header-poster">
            <img src="poster.jpg" alt="афиша" class="pixel-border">
        </div>
        
        <h1>слабости<br>или<br>последствия<br>слабости</h1>
        
        <div class="event-description">
            <!-- сюда вставишь описание мероприятия -->
            <p>место для описания мероприятия</p>
        </div>
        
        <div class="info">
            <div class="date">17 сентября | 20:00</div>
            <div class="venue">бар салон | челябинск</div>
            <div class="band">грязный блок сигарет</div>
        </div>

        <button class="ticket-btn" onclick="showPayment()">билет — 300₽</button>
        
        <div class="payment" id="payment">
            <h2>оплата</h2>
            <p>перевод на озон банк</p>
            <div class="phone" onclick="copyPhone()">+7 912 039 76 48</div>
            <p class="hint">нажми чтобы скопировать</p>
            
            <div class="qr-container" onclick="copyPhone()">
                <div id="qrcode"></div>
            </div>
            
            <div class="sum">300₽</div>
            <button class="pay-btn" onclick="sendData()">я оплатил</button>
            <button class="back-btn" onclick="hidePayment()">назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let qrGenerated = false;

        function showPayment() {
            document.getElementById('payment').classList.add('active');
            if (!qrGenerated) {
                new QRCode(document.getElementById('qrcode'), {
                    text: '+79120397648',
                    width: 180,
                    height: 180,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        }

        function hidePayment() {
            document.getElementById('payment').classList.remove('active');
        }

        function copyPhone() {
            navigator.clipboard.writeText('+79120397648');
            tg.showPopup({
                title: 'скопировано',
                message: 'номер телефона скопирован',
                buttons: [{type: 'ok'}]
            });
        }

        function sendData() {
            const data = JSON.stringify({ tariff: 'base' });
            tg.sendData(data);
            tg.close();
        }

        tg.ready();
    </script>
</body>
</html>
